---
<article class="document page">

    <a class="back-link" href="{{ '/' | relative_url }}">← ホーム</a>
    <h1>{{ page.title | escape }}</h1>
  </header>
  {% assign proxy_image = '/images/proxy-ssh.png' | relative_url %}
  <div class="entry prose">{{ content | replace: 'http://nya-tex.net/images/proxy-ssh.png', proxy_image }}</div>
  <div class="document-bottom"><a href="{{ '/' | relative_url }}">← ホームに戻る</a></div>
</article>
