---
layout: home
---
<div class="posts">
  {% for post in site.posts %}
  <article class="post-row">
    <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y-%m-%d" }}</time>
    <h3><a href="{{ post.url | relative_url }}">{{ post.title | escape }}<span aria-hidden="true">↗</span></a></h3>
  </article>
  {% endfor %}
</div>
